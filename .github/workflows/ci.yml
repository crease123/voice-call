# CI for the voice-call plugin.
#
# What runs: install -> build -> unit tests.
#
# The build is self-contained: the Typert artifacts are generated in a Harness
# checkout once and committed under generated/, then staged into each package's
# lib/ by scripts/stage-typert.mjs. Refresh them with `pnpm run regen:typert`
# when `@Remote` methods or the protocol line change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # pnpm must be installed before setup-node so `cache: pnpm` can find it.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:voice-output