# CI for the voice-call plugin.
#
# What runs: install -> typecheck -> unit tests.
#
# Why a full `pnpm run build` is not here yet: scripts/build.mjs calls
# scripts/generate-remote.mjs, which requires DSH_HARNESS_ROOT pointing at a
# matching DeepSeek Harness checkout with built Typert artifacts. A hosted
# runner cannot reproduce that yet. Making the build self-contained (for
# example by committing the generated metadata, the way dsh-journal-calendar
# commits its generated artifacts) is a separate change; this workflow already
# covers the parts that do not depend on it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # pnpm must be installed before setup-node so `cache: pnpm` can find it.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The client packages import generated declarations from lib/, so only
      # the two host packages can be typechecked without a full build.
      - name: Typecheck
        run: |
          pnpm exec tsc -p packages/experimental/voice-speech-doubao/tsconfig.json
          pnpm exec tsc -p packages/experimental/personal-agent/tsconfig.json

      - name: Test
        run: pnpm run test:voice-output